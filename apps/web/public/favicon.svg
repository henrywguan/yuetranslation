<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <clipPath id="tile">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
    <!-- Glow jade center → dark harbor rim. -->
    <radialGradient id="glow" cx="50%" cy="50%" r="72%">
      <stop offset="0" stop-color="#b8fff0"/>
      <stop offset="0.18" stop-color="#7ef0dc"/>
      <stop offset="0.38" stop-color="#3dcfb6"/>
      <stop offset="0.58" stop-color="#1f8f7a"/>
      <stop offset="0.78" stop-color="#0b3d36"/>
      <stop offset="1" stop-color="#07131f"/>
    </radialGradient>
    <filter id="jadeGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="blur"/>
      <feFlood flood-color="#7ef0dc" flood-opacity="0.9" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="rim" x1="10" y1="2" x2="54" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b8fff0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#041018" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#glow)"/>
  </g>

  <rect x="1.5" y="1.5" width="61" height="61" rx="13" stroke="url(#rim)" stroke-width="1.25"/>

  <text
    x="32"
    y="43.5"
    text-anchor="middle"
    font-family="Noto Sans HK, 'PingFang HK', 'WenQuanYi Micro Hei', sans-serif"
    font-size="36"
    font-weight="800"
    fill="#7ef0dc"
    stroke="#7ef0dc"
    stroke-width="1.1"
    paint-order="stroke fill"
    filter="url(#jadeGlow)"
  >粵</text>
</svg>
