<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <clipPath id="tile">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
    <!-- Mostly dark harbor; tiny soft jade kiss under the glyph only. -->
    <radialGradient id="glow" cx="50%" cy="50%" r="82%">
      <stop offset="0" stop-color="#14564b"/>
      <stop offset="0.18" stop-color="#0b3d36"/>
      <stop offset="0.4" stop-color="#081820"/>
      <stop offset="0.7" stop-color="#07131f"/>
      <stop offset="1" stop-color="#050e16"/>
    </radialGradient>
    <linearGradient id="rim" x1="10" y1="2" x2="54" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7ef0dc" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#041018" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#glow)"/>
  </g>

  <rect x="1.5" y="1.5" width="61" height="61" rx="13" stroke="url(#rim)" stroke-width="1.25"/>

  <!-- Jade 粵 with minimal glow so the harbor field stays dominant. -->
  <text
    x="32"
    y="43.5"
    text-anchor="middle"
    font-family="Noto Sans HK, 'PingFang HK', 'WenQuanYi Micro Hei', sans-serif"
    font-size="34"
    font-weight="800"
    fill="#7ef0dc"
    stroke="#3dcfb6"
    stroke-width="0.55"
    paint-order="stroke fill"
    opacity="0.96"
  >粵</text>
</svg>
