    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+HK:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <title>JyutTranslate — AI Language Tool</title>
    <script>
      // Clean paths for store listings / share links → hash routes (SPA).
      (() => {
        const path = (location.pathname || '/').replace(/\/+$/, '') || '/'
        const map = {
          '/delete-account': '#/delete-account',
          '/privacy': '#/privacy',
          '/terms': '#/terms',
          '/app': '#/app',
          '/pricing': '#/pricing',
          '/tones': '#/tones',
          '/admin': '#/admin',
        }
        const target = map[path]
        if (target && !location.hash) {
          location.replace(target + (location.search || ''))
        }
      })()
    </script>
    <script>
      // Register ASAP (no window.load wait) so PWA scanners / Puppeteer can detect /sw.js.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {})
      }
    </script>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('yue-theme')
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#eef5f8' : '#07131f')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
