<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JyutTranslate — language expansion</title>
<script src="/_st/stage.js"></script>
<link rel="stylesheet" href="/_st/themes/neutral.css">
<script type="module" src="/_st/components/index.js"></script>
<link rel="stylesheet" href="fonts/syne/font.css">
<link rel="stylesheet" href="fonts/noto-sans-hk/font.css">
<link rel="stylesheet" href="fonts/noto-sans-tc/font.css">
<link rel="stylesheet" href="fonts/noto-sans/font.css">
<link rel="stylesheet" href="fonts/noto-sans-jp/font.css">
<link rel="stylesheet" href="fonts/noto-sans-kr/font.css">
<link rel="stylesheet" href="fonts/noto-sans-arabic/font.css">
<link rel="stylesheet" href="fonts/noto-sans-thai/font.css">
<style>
  :root {
    --bg: #eef5f8;
    --fg: #07131f;
    --muted: #3a4550;
    --accent: #0a5a4a;
    --accent-2: #3dcfb6;
    --surface: #ffffff;
    --font-display: "Syne", system-ui, sans-serif;
    --font-body: "Noto Sans HK", "Noto Sans TC", "Noto Sans JP", "Noto Sans KR", "Noto Sans Arabic", "Noto Sans", system-ui, sans-serif;
    --cap-font: "Noto Sans HK", "Noto Sans TC", "Noto Sans JP", "Noto Sans KR", "Noto Sans Arabic", "Noto Sans", system-ui, sans-serif;
    --cap-ink: #07131f;
    --cap-outline: #eef5f8;
    --cap-accent: #0a5a4a;
  }
  .scene {
    background:
      radial-gradient(120% 70% at 18% 8%, color-mix(in oklab, var(--accent-2) 42%, transparent), transparent 58%),
      radial-gradient(90% 60% at 92% 88%, color-mix(in oklab, #d7eef5 80%, transparent), transparent 55%),
      linear-gradient(165deg, #eef5f8 0%, #e1f1ee 100%);
  }
  .hook-wrap {
    position: absolute; left: 7cqw; right: 16cqw; top: 20cqh;
    max-width: 76cqw;
  }
  .hook-title {
    margin: 0;
    font: 800 9.2cqw/1.02 var(--font-display);
    letter-spacing: -0.04em;
    color: var(--fg);
    max-width: 100%;
  }
  .hook-title em { font-style: normal; color: var(--accent); }
  .hook-sub {
    margin: 2.2cqh 0 0;
    font: 700 4.6cqw/1.3 var(--font-body);
    color: var(--muted);
  }
  .chip-row {
    position: absolute; left: 7cqw; right: 16cqw; top: 44cqh;
    display: flex; flex-wrap: wrap; gap: 1.8cqw;
    max-height: 16cqh;
  }
  .chip {
    padding: 1.6cqw 2.8cqw; border-radius: 999px;
    background: color-mix(in oklab, var(--accent) 10%, var(--surface));
    color: var(--accent);
    font: 700 4.2cqw/1.2 var(--font-body);
    border: max(1px, 0.15cqmin) solid color-mix(in oklab, var(--accent) 32%, transparent);
  }
  .chip.jp { font-family: "Noto Sans JP", var(--font-body); }
  .chip.kr { font-family: "Noto Sans KR", var(--font-body); font-weight: 700; }
  .chip.ar { font-family: "Noto Sans Arabic", var(--font-body); direction: rtl; }
  .chip.hi { font-family: "Noto Sans", var(--font-body); }
  .chip.yue { font-family: "Noto Sans HK", "Noto Sans TC", var(--font-body); }
  .center-lang {
    position: absolute; left: 7cqw; right: 16cqw; top: 28cqh;
    text-align: center; margin: 0;
    font: 800 12cqw/1.05 var(--font-body);
    letter-spacing: -0.03em; color: var(--fg);
  }
  .center-lang.jp { font-family: "Noto Sans JP", var(--font-body); }
  .center-lang.kr { font-family: "Noto Sans KR", var(--font-body); font-weight: 700; }
  .center-lang.ar { font-family: "Noto Sans Arabic", var(--font-body); direction: rtl; }
  .center-lang.hi { font-family: "Noto Sans", var(--font-body); }
  .center-lang.yue { font-family: "Noto Sans HK", "Noto Sans TC", var(--font-body); }
  .jade {
    position: absolute; left: 28%; right: 28%; top: 48cqh; height: 0.55cqh;
    border-radius: 1cqh; background: var(--accent);
    transform-origin: 0 50%;
  }
  .gloss {
    position: absolute; left: 7cqw; right: 16cqw; top: 54cqh;
    text-align: center; font: 700 4.4cqw/1.3 var(--font-body); color: var(--muted);
  }
  .phone-wrap {
    position: absolute; left: 18cqw; right: 18cqw; top: 20cqh; height: 38cqh;
    display: grid; place-items: center;
  }
  .phone {
    width: 72%; height: 100%; border-radius: 6.5cqw;
    background: #0a1218; border: 0.85cqw solid #1c2a33;
    box-shadow: 0 3.5cqh 9cqh color-mix(in oklab, #07131f 35%, transparent),
                0 0 7cqw color-mix(in oklab, var(--accent-2) 32%, transparent);
    overflow: hidden; position: relative;
  }
  .phone img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center top;
  }
  .close-word {
    position: absolute; left: 8cqw; right: 16cqw; top: 12.5cqh;
    text-align: center;
    font: 800 6.4cqw/1 var(--font-display);
    letter-spacing: -0.04em; color: var(--fg);
  }
  .close-mark {
    position: absolute; left: 50%; top: 59cqh; width: 7cqw; height: 7cqw;
    margin-left: -3.5cqw; border-radius: 1.5cqw;
  }
</style>
</head>
<body>
<div class="stage">

  <section class="scene" id="hook" data-start="0" data-dur="3.5">
    <div class="hook-wrap">
      <h1 class="hook-title" data-st="kinetic-type" data-style="pop" data-by="words" data-at="0.051">
        <em>More</em> languages.
      </h1>
      <p class="hook-sub" data-st="kinetic-type" data-style="rise" data-at="0.385">Cantonese stays the heart.</p>
    </div>
    <div class="chip-row">
      <span class="chip jp" data-st="kinetic-type" data-style="fade" data-at="0.856">日本語</span>
      <span class="chip kr" data-st="kinetic-type" data-style="fade" data-at="0.985">한국어</span>
      <span class="chip" data-st="kinetic-type" data-style="fade" data-at="1.113">Español</span>
      <span class="chip" data-st="kinetic-type" data-style="fade" data-at="1.242">Français</span>
      <span class="chip hi" data-st="kinetic-type" data-style="fade" data-at="1.37">हिन्दी</span>
      <span class="chip ar" data-st="kinetic-type" data-style="fade" data-at="1.498">العربية</span>
      <span class="chip yue" data-st="kinetic-type" data-style="fade" data-at="1.627">粵語</span>
    </div>
  </section>

  <section class="scene" id="yue" data-start="#hook" data-dur="1.209" data-transition="match 0.25">
    <h2 class="center-lang yue" data-st="kinetic-type" data-style="pop" data-at="0.027">粵語</h2>
    <div class="jade" data-st="kinetic-type" data-style="fade" data-at="0.107" data-st-decor>&nbsp;</div>
    <p class="gloss" data-st="kinetic-type" data-style="fade" data-at="0.134">Cantonese</p>
  </section>

  <section class="scene" id="ja" data-start="#yue" data-dur="1.208" data-transition="match 0.2">
    <h2 class="center-lang jp" data-st="kinetic-type" data-style="pop" data-at="0.046">日本語</h2>
    <div class="jade" data-st="kinetic-type" data-style="fade" data-at="0.182" data-st-decor>&nbsp;</div>
    <p class="gloss" data-st="kinetic-type" data-style="fade" data-at="0.228">Japanese</p>
  </section>

  <section class="scene" id="ko" data-start="#ja" data-dur="1.209" data-transition="match 0.2">
    <h2 class="center-lang kr" data-st="kinetic-type" data-style="pop" data-at="0.042">한국어</h2>
    <div class="jade" data-st="kinetic-type" data-style="fade" data-at="0.169" data-st-decor>&nbsp;</div>
    <p class="gloss" data-st="kinetic-type" data-style="fade" data-at="0.211">Korean</p>
  </section>

  <section class="scene" id="es" data-start="#ko" data-dur="1.209" data-transition="match 0.2">
    <h2 class="center-lang" data-st="kinetic-type" data-style="pop" data-at="0.036">Español</h2>
    <div class="jade" data-st="kinetic-type" data-style="fade" data-at="0.145" data-st-decor>&nbsp;</div>
    <p class="gloss" data-st="kinetic-type" data-style="fade" data-at="0.181">Spanish</p>
  </section>

  <section class="scene" id="fr" data-start="#es" data-dur="1.208" data-transition="match 0.2">
    <h2 class="center-lang" data-st="kinetic-type" data-style="pop" data-at="0.037">Français</h2>
    <div class="jade" data-st="kinetic-type" data-style="fade" data-at="0.147" data-st-decor>&nbsp;</div>
    <p class="gloss" data-st="kinetic-type" data-style="fade" data-at="0.184">French</p>
  </section>

  <section class="scene" id="hi" data-start="#fr" data-dur="1.209" data-transition="match 0.2">
    <h2 class="center-lang hi" data-st="kinetic-type" data-style="pop" data-at="0.037">हिन्दी</h2>
    <div class="jade" data-st="kinetic-type" data-style="fade" data-at="0.147" data-st-decor>&nbsp;</div>
    <p class="gloss" data-st="kinetic-type" data-style="fade" data-at="0.184">Hindi</p>
  </section>

  <section class="scene" id="ar" data-start="#hi" data-dur="1.209" data-transition="match 0.2">
    <h2 class="center-lang ar" data-st="kinetic-type" data-style="pop" data-at="0.045">العربية</h2>
    <div class="jade" data-st="kinetic-type" data-style="fade" data-at="0.179" data-st-decor>&nbsp;</div>
    <p class="gloss" data-st="kinetic-type" data-style="fade" data-at="0.224" data-caption>Arabic</p>
  </section>

  <section class="scene" id="de" data-start="#ar" data-dur="1.208" data-transition="match 0.2">
    <h2 class="center-lang" data-st="kinetic-type" data-style="pop" data-at="0.049">Deutsch</h2>
    <div class="jade" data-st="kinetic-type" data-style="fade" data-at="0.195" data-st-decor>&nbsp;</div>
    <p class="gloss" data-st="kinetic-type" data-style="fade" data-at="0.244">German</p>
  </section>

  <section class="scene" id="id" data-start="#de" data-dur="1.209" data-transition="match 0.2">
    <h2 class="center-lang" data-st="kinetic-type" data-style="pop" data-at="0.034">Bahasa</h2>
    <div class="jade" data-st="kinetic-type" data-style="fade" data-at="0.137" data-st-decor>&nbsp;</div>
    <p class="gloss" data-st="kinetic-type" data-style="fade" data-at="0.171">Indonesian</p>
  </section>

  <section class="scene" id="close" data-start="#id" data-dur="4" data-transition="match 0.35">
    <div class="close-word" data-st="kinetic-type" data-style="pop" data-at="0.036">JyutTranslate</div>
    <div class="phone-wrap" data-st="ken-burns" data-from="1.04" data-to="1" data-at="0.08" data-dur="3.6" data-st-caption-ok>
      <div class="phone" data-st-caption-ok>
        <img src="shots/solo-yue.jpg" alt="JyutTranslate Solo with Cantonese primary">
      </div>
    </div>
    <img class="close-mark" src="shots/favicon.png" alt="" data-st="logo-reveal" data-at="0.463" data-st-caption-ok>
  </section>

  <div data-st="caption-karaoke" data-src="voice/captions.words.json"
       data-style="clean-pop" data-safe="reels"></div>
</div>
</body>
</html>
