<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080" />
    <title>JyutTranslate — 現已支援普通話</title>
    <link rel="stylesheet" href="./fonts-local.css" />
    <link rel="stylesheet" href="./shared.css" />
    <link rel="stylesheet" href="./lang-launch.css" />
  </head>
  <body>
    <div class="font-preload" aria-hidden="true">
      <span class="font-preload-syne">JyutTranslate Months Free Family Plan</span>
      <span class="font-preload-hk">大家好現已支援普通話即時精準翻譯附拼音同逐字拆解</span>
      <span class="font-preload-noto">ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789•</span>
    </div>

    <article class="lang-launch" id="post">
      <div class="lang-launch__grid">
        <div class="lang-launch__copy">
          <h1 class="lang-launch__hook lang-launch__hook--zh">大家好！</h1>
          <div class="lang-launch__lines">
            <p class="lang-launch__line lang-launch__line--zh">現已支援<strong>普通話</strong>！</p>
            <p class="lang-launch__line lang-launch__line--zh">
              即時精準<strong>普通話</strong>翻譯，附拼音同逐字拆解。
            </p>
          </div>
          <div class="lang-launch__arrow" aria-hidden="true">→</div>
          <div class="lang-launch__brand">
            <img
              class="logo-mark lang-launch__logo"
              src="./source/mandarin-ads/pwa-512.png"
              width="56"
              height="56"
              alt="JyutTranslate"
            />
            <div class="lang-launch__brand-name">JyutTranslate</div>
          </div>
          <div class="lang-launch__cta">2 Months Free Family Plan</div>
          <p class="lang-launch__fine">
            Code: JYUTTESTER1023 • Ends 10/23 • Cancel before renewal to avoid automatic charge!
          </p>
        </div>

        <div class="lang-launch__phone-col">
          <div class="phone">
            <img
              class="phone__shot"
              src="./source/mandarin-ads/ui-zh-yue-cmn.jpg"
              width="1170"
              height="2532"
              alt="Real JyutTranslate Solo UI — Cantonese and Mandarin with pinyin"
            />
          </div>
        </div>
      </div>
    </article>
  </body>
</html>
