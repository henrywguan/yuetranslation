<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080" />
    <title>Harbor Quest — End CTA</title>
    <link rel="stylesheet" href="./fonts-local.css" />
    <link rel="stylesheet" href="./shared.css" />
    <link rel="stylesheet" href="./harbor-quest.css" />
  </head>
  <body>
    <div class="font-preload" aria-hidden="true">
      <span class="font-preload-syne">Harbor Quest JyutTranslate</span>
      <span class="font-preload-hk">碼頭任務</span>
      <span class="font-preload-noto">ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789</span>
    </div>
    <article class="hq-ig hq-ig--end" id="post">
      <div class="hq-ig__frame">
        <div class="hq-ig__copy">
          <div class="hq-ig__kicker">Admin preview · #/learn</div>
          <h1 class="hq-ig__title">Sail · Cast · Arena · Chart</h1>
          <p class="hq-ig__sub">
            Cantonese courses gamified for fun learning in <strong>JyutTranslate</strong>.
          </p>
        </div>
        <div class="hq-ig__stage">
          <img class="hq-ig__mark" src="./source/harbor-quest/pwa-512.png" width="200" height="200" alt="" />
          <div class="hq-ig__brand-name" style="font-size: 44px; text-align: center">JyutTranslate</div>
          <div class="hq-ig__url" style="font-size: 24px; color: var(--jade-bright); text-align: center">
            jyuttranslate.com/#/learn
          </div>
        </div>
        <div class="hq-ig__foot">
          <div class="hq-ig__brand">
            <img class="logo-mark hq-ig__logo" src="./source/harbor-quest/pwa-512.png" width="56" height="56" alt="" />
            <div class="hq-ig__brand-name">Harbor Quest</div>
          </div>
          <div class="hq-ig__cta">Launch translator</div>
        </div>
      </div>
    </article>
  </body>
</html>
