<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080" />
    <title>Primary Language — Cam Vietnamese (story)</title>
    <link rel="stylesheet" href="./fonts-local.css" />
    <link rel="stylesheet" href="./shared.css" />
    <link rel="stylesheet" href="./primary-lang.css" />
  </head>
  <body>
    <div class="font-preload" aria-hidden="true">
      <span class="font-preload-syne">Cam Vietnamese Language Tool</span>
      <span class="font-preload-hk">相機</span>
      <span class="font-preload-noto">ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ăâêôơưđ</span>
    </div>
    <article class="primary-lang primary-lang--story" id="post">
      <div class="primary-lang__frame">
        <div class="primary-lang__copy">
        <div class="primary-lang__kicker">Cam · Vietnamese primary</div>
          <h1 class="primary-lang__title">Cam menus speak your language too.</h1>
          <p class="primary-lang__sub">
            Primary <strong>Vietnamese</strong> → <strong>Dịch bằng camera</strong> —
            AR, upload, and documents labeled so the flow feels native.
          </p>
        </div>
        <div class="primary-lang__stage primary-lang__stage--single">
          <div class="phone phone--story">
            <span class="phone__side phone__side--vol-up" aria-hidden="true"></span>
            <span class="phone__side phone__side--vol-down" aria-hidden="true"></span>
            <span class="phone__side phone__side--power" aria-hidden="true"></span>
            <div class="phone__bezel">
              <div class="phone__notch" aria-hidden="true"></div>
              <div class="phone__screen">
                <img
                  class="phone__shot"
                  src="./source/primary-lang/05-cam-vi.jpg"
                  width="1170"
                  height="2532"
                  alt="Camera translation sheet with Vietnamese Primary Language"
                />
              </div>
              <div class="phone__home" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <div class="primary-lang__foot">
          <div class="primary-lang__brand">
            <img class="logo-mark primary-lang__logo" src="./source/primary-lang/pwa-512.png" width="48" height="48" alt="" />
            <div class="primary-lang__brand-name">JyutTranslate</div>
          </div>
          <div class="primary-lang__cta">Try Cam free</div>
        </div>
      </div>
    </article>
  </body>
</html>
