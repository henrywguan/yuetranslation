<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080" />
    <title>Harbor Quest — Story arena</title>
    <link rel="stylesheet" href="./fonts-local.css" />
    <link rel="stylesheet" href="./shared.css" />
    <link rel="stylesheet" href="./harbor-quest.css" />
  </head>
  <body>
    <article class="hq-ig hq-ig--story" id="post">
      <div class="hq-ig__frame">
        <div class="hq-ig__copy">
          <div class="hq-ig__kicker">Arena · 擂台</div>
          <h1 class="hq-ig__title">Pick a topic. Climb for gold.</h1>
          <p class="hq-ig__sub">Words → phrases → sentences · gold becomes ferry coins.</p>
        </div>
        <div class="hq-ig__stage">
          <div class="phone phone--lg">
            <span class="phone__side phone__side--vol-up" aria-hidden="true"></span>
            <span class="phone__side phone__side--vol-down" aria-hidden="true"></span>
            <span class="phone__side phone__side--power" aria-hidden="true"></span>
            <div class="phone__bezel">
              <div class="phone__notch" aria-hidden="true"></div>
              <div class="phone__screen">
                <img class="phone__shot" src="./source/harbor-quest/03-arena.jpg" width="1170" height="2532" alt="Harbor Quest arena" />
              </div>
              <div class="phone__home" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <div class="hq-ig__foot">
          <div class="hq-ig__brand">
            <img class="logo-mark hq-ig__logo" src="./source/harbor-quest/pwa-512.png" width="56" height="56" alt="" />
            <div class="hq-ig__brand-name">JyutTranslate</div>
          </div>
          <div class="hq-ig__cta">Harbor Quest</div>
        </div>
      </div>
    </article>
  </body>
</html>
