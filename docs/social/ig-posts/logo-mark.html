<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>JyutTranslate logo mark</title>
    <style>
      @font-face {
        font-family: 'SyneLogo';
        font-style: normal;
        font-weight: 800;
        font-display: block;
        src: url('./fonts/syne-latin-800-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'NotoYue';
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url('./fonts/noto-sans-hk-yue-700.woff2') format('woff2');
        unicode-range: U+7CB5;
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      /* 3× product mark (64 → 192 CSS px), screenshot at deviceScaleFactor 8 → 1536 PNG */
      #mark {
        width: 192px;
        height: 192px;
        position: relative;
        border-radius: 54px;
        overflow: hidden;
        background: linear-gradient(145deg, #7ef0dc, #3dcfb6 45%, #1f8f7a);
      }
      #mark::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.42), transparent 70%);
        pointer-events: none;
      }
      /* Social mark: light J (ink) + dark 粵 (on-jade) so 粵 stays legible at 72px.
         Dark-on-dark product SVG reads in-app; raster posts need this contrast. */
      .j {
        position: absolute;
        left: 30px;
        top: 50%;
        transform: translateY(-46%);
        font-family: SyneLogo, sans-serif;
        font-weight: 800;
        font-size: 138px;
        line-height: 1;
        letter-spacing: -0.055em;
        color: #e8f4ff;
        z-index: 1;
      }
      .yue {
        position: absolute;
        left: 114px;
        top: 69px;
        transform: translateX(-50%);
        font-family: NotoYue, 'Noto Sans HK', sans-serif;
        font-weight: 700;
        font-size: 54px;
        line-height: 1;
        color: #041018;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div id="mark">
      <span class="j">J</span>
      <span class="yue">粵</span>
    </div>
  </body>
</html>
