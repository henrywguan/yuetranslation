<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080" />
    <title>Harbor Quest — Story title</title>
    <link rel="stylesheet" href="./fonts-local.css" />
    <link rel="stylesheet" href="./shared.css" />
    <link rel="stylesheet" href="./harbor-quest.css" />
  </head>
  <body>
    <article class="hq-ig hq-ig--story hq-ig--cover" id="post">
      <div class="hq-ig__frame">
        <div class="hq-ig__copy">
          <div class="hq-ig__kicker">Reveal · 10s</div>
          <h1 class="hq-ig__title">Cantonese gamified voyage.</h1>
          <p class="hq-ig__sub">
            Courses gamified for fun learning in <strong>JyutTranslate</strong> — Sail · Cast · Arena · Chart.
          </p>
        </div>
        <div class="hq-ig__stage">
          <img class="hq-ig__mark" src="./source/harbor-quest/pwa-512.png" width="220" height="220" alt="" />
          <div class="hq-ig__chips">
            <span class="hq-ig__chip">Sail</span>
            <span class="hq-ig__chip">Cast</span>
            <span class="hq-ig__chip">Arena</span>
            <span class="hq-ig__chip">Chart</span>
          </div>
        </div>
        <div class="hq-ig__foot">
          <div class="hq-ig__brand">
            <img class="logo-mark hq-ig__logo" src="./source/harbor-quest/pwa-512.png" width="56" height="56" alt="" />
            <div class="hq-ig__brand-name">JyutTranslate</div>
          </div>
          <div class="hq-ig__cta">Swipe up · #/learn</div>
        </div>
      </div>
    </article>
  </body>
</html>
