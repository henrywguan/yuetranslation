<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080" />
    <title>Two campaigns. Fourteen piers.</title>
    <link rel="stylesheet" href="./fonts-local.css" />
    <link rel="stylesheet" href="./shared.css" />
    <link rel="stylesheet" href="./harbor-quest.css" />
  </head>
  <body>
    <div class="font-preload" aria-hidden="true">
      <span class="font-preload-syne">Harbor Quest JyutTranslate</span>
      <span class="font-preload-hk">碼頭任務粵語聲韻</span>
      <span class="font-preload-noto">ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789</span>
    </div>
    <article class="hq-ig" id="post">
      <div class="hq-ig__frame">
        <div class="hq-ig__copy">
          <div class="hq-ig__kicker">Pier chart · campaigns</div>
          <h1 class="hq-ig__title">Two campaigns. Fourteen piers.</h1>
          <p class="hq-ig__sub"><strong>Sounds</strong> · initials, finals, six tones. <strong>Life Unit 0</strong> · listen-first classroom talk.</p>
        </div>
        <div class="hq-ig__stage">
          <div class="phone phone--lg">
            <span class="phone__side phone__side--vol-up" aria-hidden="true"></span>
            <span class="phone__side phone__side--vol-down" aria-hidden="true"></span>
            <span class="phone__side phone__side--power" aria-hidden="true"></span>
            <div class="phone__bezel">
              <div class="phone__notch" aria-hidden="true"></div>
              <div class="phone__screen">
                <img class="phone__shot" src="./source/harbor-quest/05-pier-chart.jpg" width="1170" height="2532" alt="Harbor Quest pier chart" />
              </div>
              <div class="phone__home" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <div class="hq-ig__foot">
          <div class="hq-ig__brand">
            <img class="logo-mark hq-ig__logo" src="./source/harbor-quest/pwa-512.png" width="48" height="48" alt="" />
            <div class="hq-ig__brand-name">JyutTranslate</div>
          </div>
          <div class="hq-ig__cta">See the chart</div>
        </div>
      </div>
    </article>
  </body>
</html>
